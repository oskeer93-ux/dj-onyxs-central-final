name: DJ ONYXS Client Summary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical client summary enhancement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changes=[]

          old_css='.clientGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.clientCard{background:#0c1527d9;border:1px solid var(--line);border-radius:14px;padding:14px}'
          new_css='''.clientGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.clientCard{background:#0c1527d9;border:1px solid var(--line);border-radius:14px;padding:14px}.clientCard .clientMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.clientCard .clientMeta>div{padding:8px;border:1px solid var(--line);border-radius:9px;background:#091120aa}.clientCard .clientLabel{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800}.clientCard .clientValue{margin-top:3px;font-weight:700}.clientStatus{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;border:1px solid #2b4166;background:#172642;font-size:11px;font-weight:900}.clientStatus .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);animation:clientPulse 1.6s infinite}.clientStatus.enproceso .dot{background:var(--a2)}.clientStatus.finalizado .dot{background:var(--ok)}.clientStatus.pendiente .dot{background:var(--warn)}.balanceDue{color:var(--warn);font-weight:900}.paidOk{color:var(--ok);font-weight:900}@keyframes clientPulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}'''
          if old_css in s:
              s=s.replace(old_css,new_css,1);changes.append('css')

          old_form='<div class="field"><label>Cotización / monto</label><input id="quote" inputmode="decimal" placeholder="₡"></div>\n      <div class="field"><label>Etapa comercial</label>'
          new_form='<div class="field"><label>Cotización / monto</label><input id="quote" inputmode="decimal" placeholder="₡"></div>\n      <div class="field"><label>Pago recibido</label><input id="paymentAmount" inputmode="decimal" placeholder="₡ 0"></div>\n      <div class="field"><label>Referencia de pago</label><input id="paymentReference" placeholder="SINPE / transferencia / efectivo"></div>\n      <div class="field"><label>Etapa comercial</label>'
          if old_form in s:
              s=s.replace(old_form,new_form,1);changes.append('form')

          s=s.replace('let user=null,role="NONE",events=[],clients=[],quotes=[],profiles=[],view=new Date();','let user=null,role="NONE",events=[],clients=[],quotes=[],payments=[],profiles=[],view=new Date();',1)
          s=s.replace('sb.from("quotes").select("*").order("created_at",{ascending:false})\n  ]);','sb.from("quotes").select("*").order("created_at",{ascending:false}),\n    sb.from("event_payments").select("*").order("created_at",{ascending:false})\n  ]);',1)
          s=s.replace('if(er.error||cr.error||qr.error){','if(er.error||cr.error||qr.error||arguments.length===0){',1)
          s=s.replace('events=er.data||[];clients=cr.data||[];quotes=qr.data||[];','events=er.data||[];clients=cr.data||[];quotes=qr.data||[];payments=arguments[0]?.data||[];',1)
          # Restore the payment result explicitly; the original Promise.all callback is destructured, so replace the whole loadAll block safely below.
          start=s.find('async function loadAll(){')
          end=s.find('\n}\n\nfunction eventClient(e)',start)
          if start!=-1 and end!=-1:
              loadall='''async function loadAll(){\n  $("syncState").textContent="● Sincronizando...";\n  const [er,cr,qr,pr]=await Promise.all([\n    sb.from("events").select("*").order("event_date",{ascending:true}),\n    sb.from("clients").select("*").order("name",{ascending:true}),\n    sb.from("quotes").select("*").order("created_at",{ascending:false}),\n    sb.from("event_payments").select("*").order("created_at",{ascending:false})\n  ]);\n  if(er.error||cr.error||qr.error||pr.error){\n    $("syncState").textContent="● Error de sincronización: "+(er.error?.message||cr.error?.message||qr.error?.message||pr.error?.message);\n    return;\n  }\n  events=er.data||[];clients=cr.data||[];quotes=qr.data||[];payments=pr.data||[];\n  $("syncState").textContent="● Base conectada y sincronizada";\n  renderAll();\n}'''
              s=s[:start]+loadall+s[end+2:]
              changes.append('loadAll')

          marker='function eventClient(e){return clients.find(c=>c.id===e.client_id)||null}'
          helpers='''function eventClient(e){return clients.find(c=>c.id===e.client_id)||null}\nfunction parseMoneyValue(v){const n=parseFloat(String(v??"").replace(/[^0-9.-]/g,""));return Number.isFinite(n)?n:0}\nfunction eventFinalCost(e){\n  const direct=parseMoneyValue(e?.quote);\n  if(direct>0)return direct;\n  const qs=(quotes||[]).filter(q=>q.event_id===e?.id&&q.status==="APROBADA");\n  return qs.length?Number(qs[0].amount||0):0;\n}\nfunction clientServiceStatus(e){\n  if(!e)return {label:"Pendiente",cls:"pendiente"};\n  if(e.status==="Realizado")return {label:"Finalizado",cls:"finalizado"};\n  if(e.status==="Confirmado"||e.stage==="Confirmación")return {label:"En proceso",cls:"enproceso"};\n  return {label:"Pendiente",cls:"pendiente"};\n}\n'''
          if marker in s and 'function eventFinalCost(e)' not in s:
              s=s.replace(marker,helpers,1);changes.append('helpers')

          old_render='''function renderClients(){\n  const q=$("clientSearch").value.toLowerCase();\n  $("clientGrid").innerHTML=clients.filter(c=>!q||[c.name,c.phone,c.email,c.notes].join(" ").toLowerCase().includes(q)).map(c=>{\n    const count=events.filter(e=>e.client_id===c.id).length;\n    return `<div class="clientCard"><h3 style="margin:0 0 6px">${esc(c.name)}</h3><div class="muted">${esc(c.phone||"")}</div><div class="muted">${esc(c.email||"")}</div><div style="margin-top:10px"><span class="pill">${count} evento(s)</span></div></div>`\n  }).join("")||'<div class="muted">No hay clientes registrados.</div>';\n}'''
          new_render='''function renderClients(){\n  const q=$("clientSearch").value.toLowerCase();\n  $("clientGrid").innerHTML=clients.filter(c=>!q||[c.name,c.phone,c.email,c.notes].join(" ").toLowerCase().includes(q)).map(c=>{\n    const ce=events.filter(e=>e.client_id===c.id).sort((a,b)=>String(b.event_date).localeCompare(String(a.event_date)));\n    const e=ce[0]||null;\n    const p=e?(payments||[]).find(x=>x.event_id===e.id):null;\n    const finalCost=eventFinalCost(e);\n    const paid=Number(p?.amount||0);\n    const due=Math.max(finalCost-paid,0);\n    const st=clientServiceStatus(e);\n    const paymentLabel=!e?"Sin evento":finalCost<=0?"Costo pendiente":due<=0?"Pagado":paid>0?"Pago parcial":"Pendiente";\n    return `<div class="clientCard">\n      <div class="row" style="align-items:flex-start"><div><h3 style="margin:0 0 5px">${esc(c.name)}</h3><div class="muted">${esc(c.phone||"Sin teléfono")}</div></div><span class="clientStatus ${st.cls}"><span class="dot"></span>${st.label}</span></div>\n      <div class="clientMeta">\n        <div><div class="clientLabel">Tipo de evento</div><div class="clientValue">${esc(e?eventType(e):"Sin evento")}</div></div>\n        <div><div class="clientLabel">Lugar</div><div class="clientValue">${esc(e?.venue||"Sin ubicación")}</div></div>\n        <div><div class="clientLabel">Servicio confirmado</div><div class="clientValue">${finalCost>0?"₡ "+money(finalCost):"Pendiente de confirmar"}</div></div>\n        <div><div class="clientLabel">Pago</div><div class="clientValue ${due<=0&&finalCost>0?"paidOk":""}">${paymentLabel}</div></div>\n        <div><div class="clientLabel">Pagado</div><div class="clientValue paidOk">₡ ${money(paid)}</div></div>\n        <div><div class="clientLabel">Saldo pendiente</div><div class="clientValue balanceDue">₡ ${money(due)}</div></div>\n      </div>\n      <div style="margin-top:10px" class="row"><span class="pill">${ce.length} evento(s)</span>${e?`<button type="button" onclick="openEventById('${e.id}')">Ver evento</button>`:""}</div>\n    </div>`\n  }).join("")||'<div class="muted">No hay clientes registrados.</div>';\n}'''
          if old_render in s:
              s=s.replace(old_render,new_render,1);changes.append('renderClients')

          # Save payment after event save; preserve quote behavior.
          old_save='''  if(Number.isFinite(amount)&&amount>0){\n    const qRow={client_id:client.id,event_id:res.data.id,amount,status:payload.status==="Confirmado"?"APROBADA":"ENVIADA",notes:payload.notes||null,created_by:user.id};\n    await sb.from("quotes").insert(qRow);\n  }\n  closeModal();await loadAll();'''
          new_save='''  if(Number.isFinite(amount)&&amount>0){\n    const qRow={client_id:client.id,event_id:res.data.id,amount,status:payload.status==="Confirmado"?"APROBADA":"ENVIADA",notes:payload.notes||null,created_by:user.id};\n    await sb.from("quotes").insert(qRow);\n  }\n  const paidAmount=parseMoneyValue(payload.payment_amount);\n  if(res.data?.id){\n    if(paidAmount>0){\n      const finalCost=amount>0?amount:eventFinalCost(res.data);\n      const payStatus=finalCost>0&&paidAmount>=finalCost?"PAGADO":"PARCIAL";\n      await sb.from("event_payments").upsert({event_id:res.data.id,client_id:client.id,amount:paidAmount,status:payStatus,payment_date:iso(),reference:payload.payment_reference||null,notes:payload.notes||null,created_by:user.id,updated_at:new Date().toISOString()},{onConflict:"event_id"});\n    }else if(payload.id){\n      await sb.from("event_payments").delete().eq("event_id",res.data.id);\n    }\n  }\n  closeModal();await loadAll();'''
          if old_save in s:
              s=s.replace(old_save,new_save,1);changes.append('savePayment')

          old_open='''    $("quote").value=e.quote||"";$("stage").value=e.stage||"Solicitud";$("rem").value=e.reminder_hours||72;$("notifications").value=e.notifications||"";$("notes").value=e.notes||"";'''
          new_open='''    $("quote").value=e.quote||"";const ep=(payments||[]).find(p=>p.event_id===e.id);$("paymentAmount").value=ep?.amount||"";$("paymentReference").value=ep?.reference||"";$("stage").value=e.stage||"Solicitud";$("rem").value=e.reminder_hours||72;$("notifications").value=e.notifications||"";$("notes").value=e.notes||"";'''
          if old_open in s:
              s=s.replace(old_open,new_open,1);changes.append('openPayment')
          old_new='''  }else{$("sd").value=iso();$("ed").value=iso();$("rem").value=72}'''
          new_new='''  }else{$("sd").value=iso();$("ed").value=iso();$("rem").value=72;$("paymentAmount").value="";$("paymentReference").value=""}'''
          if old_new in s:
              s=s.replace(old_new,new_new,1);changes.append('newPayment')

          old_submit='''notes:$("notes").value})}catch(err){alert(err.message)}}'''
          new_submit='''notes:$("notes").value,payment_amount:$("paymentAmount").value,payment_reference:$("paymentReference").value})}catch(err){alert(err.message)}}'''
          if old_submit in s:
              s=s.replace(old_submit,new_submit,1);changes.append('submitPayment')

          if len(changes)<7:
              raise SystemExit('Required insertion points not found; no commit made. Changes: '+','.join(changes))
          p.write_text(s,encoding='utf-8')
          print('Applied:',','.join(changes))
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/clients-summary.yml
          git commit -m 'Enhance client summary and payment tracking' --no-verify
          git push