name: Fix single event date field

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicate end-date field without changing the rest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('<div class="field"><label>Fecha inicio *</label><input id="sd" type="date" required></div>\n      <div class="field"><label>Fecha fin</label><input id="ed" type="date"></div>',
               '<div class="field"><label>Fecha del evento *</label><input id="sd" type="date" required></div>'),
              ('list.filter(e=>di>=String(e.event_date)&&di<=String(e.end_date||e.event_date))',
               'list.filter(e=>di===String(e.event_date))'),
              ('openEvent();$("sd").value=b.dataset.add;$("ed").value=b.dataset.add',
               'openEvent();$("sd").value=b.dataset.add'),
              ('$("client").value=c?.name||e.title||"";$("contact").value=e.contact||c?.phone||"";$("sd").value=e.event_date||"";$("ed").value=e.end_date||e.event_date||"";',
               '$("client").value=c?.name||e.title||"";$("contact").value=e.contact||c?.phone||"";$("sd").value=e.event_date||"";'),
              ('}else{$("sd").value=iso();$("ed").value=iso();$("rem").value=72;',
               '}else{$("sd").value=iso();$("rem").value=72;'),
              ('start_date:$("sd").value,end_date:$("ed").value||$("sd").value,start_time:',
               'start_date:$("sd").value,end_date:$("sd").value,start_time:'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected source fragment not found: {old[:100]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix event form to use one date" || exit 0
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-event-date-field.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary date fix workflow"
          git push
