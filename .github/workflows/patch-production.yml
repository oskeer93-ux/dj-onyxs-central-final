name: Patch production checklist
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add per-event production checklist
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid var(--line);border-radius:11px;background:#0b1221aa}.check input{width:auto}'
          new_css=old_css + '.productionEvents{display:grid;gap:14px}.productionEvent{border:1px solid var(--line);border-radius:15px;background:#0b1221cc;padding:14px}.productionEventHead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.productionEventMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.productionProgress{min-width:180px}.productionProgressBar{height:7px;border-radius:999px;background:#172642;overflow:hidden;border:1px solid #263b60}.productionProgressBar span{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:999px}.productionChecklist{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.productionCheck{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#080f1d}.productionCheck.done{border-color:#28694f;background:#0b1d19}.productionCheck input{width:auto}.productionEventActions{display:flex;gap:8px;justify-content:flex-end;margin-top:11px}.productionEmpty{padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}.productionSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.productionSummary .card{padding:12px}@media(max-width:700px){.productionChecklist{grid-template-columns:1fr}.productionEventHead{grid-template-columns:1fr}.productionSummary{grid-template-columns:1fr}}'
          if old_css not in s: raise SystemExit('CSS anchor not found')
          s=s.replace(old_css,new_css,1)
          old_html='''  <section id="productionTab" class="tabpane hidden">\n    <div class="card">\n      <div class="row"><div><h2>Producción</h2><div class="muted">Checklist operativo de la Central.</div></div><button id="resetChecklist">Reset checklist</button></div>\n      <div class="checklist" id="checklist"></div>\n    </div>\n\n    <div class="card" id="adminPanel" style="margin-top:14px;display:none">'''
          new_html='''  <section id="productionTab" class="tabpane hidden">\n    <div class="card">\n      <div class="row"><div><h2>Producción</h2><div class="muted">Bitácora operativa por evento. Cada evento tiene su propio checklist y progreso.</div></div><button id="resetChecklist">Reset general</button></div>\n      <div class="productionSummary">\n        <div class="card"><div class="num" id="prodTotal">0</div><div class="label">Eventos con producción</div></div>\n        <div class="card"><div class="num" id="prodDone">0%</div><div class="label">Avance general</div></div>\n        <div class="card"><div class="num" id="prodPending">0</div><div class="label">Tareas pendientes</div></div>\n      </div>\n      <div id="checklist" class="productionEvents"></div>\n    </div>\n\n    <div class="card" id="adminPanel" style="margin-top:14px;display:none">'''
          if old_html not in s: raise SystemExit('HTML anchor not found')
          s=s.replace(old_html,new_html,1)
          old_vars='let user=null,role="NONE",events=[],clients=[],quotes=[],payments=[],profiles=[],view=new Date();view.setDate(1);'
          new_vars='let user=null,role="NONE",events=[],clients=[],quotes=[],payments=[],profiles=[],productionChecks=[],view=new Date();view.setDate(1);'
          if old_vars not in s: raise SystemExit('vars anchor not found')
          s=s.replace(old_vars,new_vars,1)
          old_load='''  const [er,cr,qr,pr]=await Promise.all([\n    sb.from("events").select("*").order("event_date",{ascending:true}),\n    sb.from("clients").select("*").order("name",{ascending:true}),\n    sb.from("quotes").select("*").order("created_at",{ascending:false}),\n    sb.from("event_payments").select("*").order("created_at",{ascending:false})\n  ]);\n  if(er.error||cr.error||qr.error||pr.error){\n    $("syncState").textContent="● Error de sincronización: "+(er.error?.message||cr.error?.message||qr.error?.message||pr.error?.message);\n    return;\n  }\n  events=er.data||[];clients=cr.data||[];quotes=qr.data||[];payments=pr.data||[];'''
          new_load='''  const [er,cr,qr,pr,pcr]=await Promise.all([\n    sb.from("events").select("*").order("event_date",{ascending:true}),\n    sb.from("clients").select("*").order("name",{ascending:true}),\n    sb.from("quotes").select("*").order("created_at",{ascending:false}),\n    sb.from("event_payments").select("*").order("created_at",{ascending:false}),\n    sb.from("production_checklists").select("*")\n  ]);\n  if(er.error||cr.error||qr.error||pr.error||pcr.error){\n    $("syncState").textContent="● Error de sincronización: "+(er.error?.message||cr.error?.message||qr.error?.message||pr.error?.message||pcr.error?.message);\n    return;\n  }\n  events=er.data||[];clients=cr.data||[];quotes=qr.data||[];payments=pr.data||[];productionChecks=pcr.data||[];\n  await migrateLegacyChecklistIfNeeded();'''
          if old_load not in s: raise SystemExit('load anchor not found')
          s=s.replace(old_load,new_load,1)
          a=s.index('const checklistDefault='); b=s.index('\nfunction renderStats()',a)
          new_check='''const checklistDefault=[\n  "Confirmar contrato / cotización","Confirmar horario y ubicación","Validar contacto del cliente",\n  "Preparar playlist / referencias","Revisar equipo y respaldo","Confirmar transporte / carga",\n  "Enviar recordatorio 72 h","Checklist final de producción"\n];\nfunction productionStateFor(eventId){const out={};(productionChecks||[]).filter(x=>x.event_id===eventId).forEach(x=>{out[x.item_index]=!!x.completed});return out}\nfunction productionProgress(state){const done=checklistDefault.reduce((n,_,i)=>n+(state[i]?1:0),0);return {done,total:checklistDefault.length,pct:Math.round(done/checklistDefault.length*100)}}\nfunction productionAutoState(e){const state={};if(!e)return state;state[0]=e.status==="Confirmado"||e.status==="Realizado"||e.stage==="Confirmación"||e.stage==="Evento realizado";state[1]=!!(e.event_date&&e.start_time&&e.end_time&&e.venue);state[2]=!!e.contact;state[6]=Number(e.reminder_hours||0)>=72&&!!e.reminder_hours;return state}\nasync function saveProductionCheck(eventId,itemIndex,completed){const payload={event_id:eventId,item_index:Number(itemIndex),completed:!!completed,updated_by:user?.id||null,updated_at:new Date().toISOString()};const {data,error}=await sb.from("production_checklists").upsert(payload,{onConflict:"event_id,item_index"}).select().single();if(error){alert("No se pudo guardar el avance: "+error.message);return}const idx=productionChecks.findIndex(x=>x.event_id===eventId&&Number(x.item_index)===Number(itemIndex));if(idx>=0)productionChecks[idx]=data;else productionChecks.push(data);renderChecklist()}\nasync function resetProductionEvent(eventId){if(!confirm("¿Resetear el checklist de este evento?"))return;const {error}=await sb.from("production_checklists").delete().eq("event_id",eventId);if(error){alert(error.message);return}productionChecks=productionChecks.filter(x=>x.event_id!==eventId);renderChecklist()}\nasync function migrateLegacyChecklistIfNeeded(){const legacy=JSON.parse(localStorage.getItem("onyxs_checklist")||"{}");if(!Object.keys(legacy).length||!events.length||productionChecks.length)return;const marker="onyxs_checklist_migrated_v3";if(localStorage.getItem(marker))return;const first=events[0];for(const [idx,val] of Object.entries(legacy)){if(val)await saveProductionCheck(first.id,idx,true)}localStorage.setItem(marker,String(Date.now()))}\nfunction renderChecklist(){const list=[...(events||[])].sort((a,b)=>String(a.event_date).localeCompare(String(b.event_date)));const totalTasks=list.length*checklistDefault.length;let totalDone=0,pending=0;$("checklist").innerHTML=list.map(e=>{const saved=productionStateFor(e.id);const auto=productionAutoState(e);const state={...auto,...saved};const prog=productionProgress(state);totalDone+=prog.done;pending+=prog.total-prog.done;const client=eventClientName(e);return `<div class="productionEvent"><div class="productionEventHead"><div><div class="row"><h3 style="margin:0">${esc(client)}</h3><span class="pill">${esc(e.status||"Solicitud")}</span></div><div class="productionEventMeta"><span class="pill">${esc(e.event_date||"")}</span><span class="pill">${esc(eventType(e))}</span><span class="pill">${esc(e.venue||"Sin ubicación")}</span>${e.start_time?`<span class="pill">${esc(String(e.start_time).slice(0,5))}${e.end_time?` → ${esc(String(e.end_time).slice(0,5))}`:""}</span>`:""}</div></div><div class="productionProgress"><div class="row"><strong>${prog.pct}%</strong><span class="small muted">${prog.done}/${prog.total} tareas</span></div><div class="productionProgressBar"><span style="width:${prog.pct}%"></span></div></div></div><div class="productionChecklist">${checklistDefault.map((x,i)=>`<label class="productionCheck ${state[i]?"done":""}"><input type="checkbox" data-prod-check="${e.id}" data-item="${i}" ${state[i]?"checked":""}>${x}</label>`).join("")}</div><div class="productionEventActions"><button type="button" onclick="openEventById('${e.id}')">Ver / editar evento</button><button type="button" class="danger" data-prod-reset="${e.id}">Reset este evento</button></div></div>`}).join("")||'<div class="productionEmpty muted">No hay eventos registrados todavía. Al crear un evento aparecerá aquí su bitácora de producción.</div>';$("prodTotal").textContent=list.length;$("prodDone").textContent=totalTasks?Math.round(totalDone/totalTasks*100)+"%":"0%";$("prodPending").textContent=pending;document.querySelectorAll("[data-prod-check]").forEach(c=>c.onchange=()=>saveProductionCheck(c.dataset.prodCheck,c.dataset.item,c.checked));document.querySelectorAll("[data-prod-reset]").forEach(b=>b.onclick=()=>resetProductionEvent(b.dataset.prodReset))}\n'''
          s=s[:a]+new_check+s[b:]
          old_reset='$("resetChecklist").onclick=()=>{localStorage.removeItem("onyxs_checklist");renderChecklist()}'
          new_reset='$("resetChecklist").onclick=()=>{if(confirm("¿Resetear todos los checklists por evento?")){sb.from("production_checklists").delete().neq("event_id","00000000-0000-0000-0000-000000000000").then(({error})=>{if(error)alert(error.message);else{productionChecks=[];renderChecklist()}})}}'
          if old_reset not in s: raise SystemExit('reset anchor not found')
          s=s.replace(old_reset,new_reset,1)
          old_channel='''const channel=sb.channel("onyxs-live-final").on("postgres_changes",{event:"*",schema:"public",table:"events"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"clients"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"quotes"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>loadProfile().then(()=>loadAll())).subscribe();'''
          new_channel='''const channel=sb.channel("onyxs-live-final").on("postgres_changes",{event:"*",schema:"public",table:"events"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"clients"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"quotes"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"event_payments"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"production_checklists"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>loadProfile().then(()=>loadAll())).subscribe();'''
          if old_channel not in s: raise SystemExit('channel anchor not found')
          s=s.replace(old_channel,new_channel,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched app and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-production.yml
          git rm .github/workflows/patch-production.yml
          git commit -m "Add per-event production checklist" || exit 0
          git push
