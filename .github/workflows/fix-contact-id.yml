name: Surgical Contact Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix duplicate Contact ID only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<button data-scroll="contact">Contacto</button>'
          new1 = '<button data-scroll="contactSection">Contacto</button>'
          old2 = '<section id="contact" class="section"'
          new2 = '<section id="contactSection" class="section"'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected Contact selectors not found; no changes made.')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit surgical fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix contact field ID collision' --no-verify
          git push
